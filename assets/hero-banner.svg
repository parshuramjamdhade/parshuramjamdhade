<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyanGlow" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Headline Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="roleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Chip Background -->
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="10" y="10" width="980" height="360" rx="18" fill="url(#bgGradient)" />
  <rect x="10" y="10" width="980" height="360" rx="18" fill="url(#grid)" />
  <rect x="10" y="10" width="980" height="360" rx="18" fill="url(#cyanGlow)" />
  <rect x="10" y="10" width="980" height="360" rx="18" fill="url(#purpleGlow)" />
  <rect x="10" y="10" width="980" height="360" rx="18" fill="url(#blueGlow)" />

  <!-- Neon Border -->
  <rect x="10" y="10" width="980" height="360" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Top Status Pill (Left) -->
  <g transform="translate(42, 42)">
    <rect x="0" y="0" width="460" height="30" rx="15" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="15" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="16" cy="15" r="7.5" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
    <text x="32" y="19" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">
      SYSTEM STATUS: <tspan fill="#34d399">ONLINE</tspan> • 7+ YRS ENTERPRISE CLOUD &amp; AI
    </text>
  </g>

  <!-- Top Right Executive Badge -->
  <g transform="translate(680, 42)">
    <rect x="0" y="0" width="278" height="30" rx="15" fill="#1e1b4b" fill-opacity="0.8" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6" />
    <text x="139" y="19" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" font-weight="600" fill="#a5b4fc" letter-spacing="1">
      ⚡ ARCHITECT / LEAD LEVEL
    </text>
  </g>

  <!-- Main Name Typography -->
  <text x="42" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="46" fill="url(#nameGrad)" letter-spacing="3">
    PARSHURAM JAMDHADE
  </text>

  <!-- Professional Subtitle -->
  <text x="44" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="17.5" fill="url(#roleGrad)" letter-spacing="1.5">
    LEAD DEVSECOPS ARCHITECT &amp; ENTERPRISE AI SYSTEMS ENGINEER
  </text>

  <!-- Executive Pitch Description -->
  <text x="44" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#cbd5e1" font-weight="400">
    Architecting zero-downtime <tspan fill="#38bdf8" font-weight="700">100+ Cloud Workload Migrations</tspan>, hardened <tspan fill="#38bdf8" font-weight="700">Zero-Trust DevSecOps</tspan>,
  </text>
  <text x="44" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#cbd5e1" font-weight="400">
    and autonomous <tspan fill="#c084fc" font-weight="700">GenAI / LLMOps Infrastructure</tspan> using Model Context Protocol (MCP) &amp; Agentic RAG.
  </text>

  <!-- Blueprint Separator Line -->
  <line x1="42" y1="268" x2="958" y2="268" stroke="#334155" stroke-width="1" stroke-opacity="0.7" stroke-dasharray="4 4" />

  <!-- Core Competency Chips -->
  <!-- Chip 1: Enterprise Migration -->
  <g transform="translate(42, 288)">
    <rect x="0" y="0" width="168" height="42" rx="8" fill="url(#chipBg)" stroke="#0284c7" stroke-width="1" stroke-opacity="0.7" />
    <text x="84" y="18" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#38bdf8">100+ WORKLOADS</text>
    <text x="84" y="32" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Zero-Downtime Azure/AWS</text>
  </g>

  <!-- Chip 2: DevSecOps Zero-Trust -->
  <g transform="translate(226, 288)">
    <rect x="0" y="0" width="168" height="42" rx="8" fill="url(#chipBg)" stroke="#059669" stroke-width="1" stroke-opacity="0.7" />
    <text x="84" y="18" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#34d399">ZERO-TRUST SHIFT-LEFT</text>
    <text x="84" y="32" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Checkov • Trivy • GitLeaks</text>
  </g>

  <!-- Chip 3: GenAI & MCP -->
  <g transform="translate(410, 288)">
    <rect x="0" y="0" width="176" height="42" rx="8" fill="url(#chipBg)" stroke="#9333ea" stroke-width="1" stroke-opacity="0.7" />
    <text x="88" y="18" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#c084fc">MCP &amp; AUTONOMOUS AI</text>
    <text x="88" y="32" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">K8s Triage • Hybrid RAG</text>
  </g>

  <!-- Chip 4: FinOps Capital Stewardship -->
  <g transform="translate(602, 288)">
    <rect x="0" y="0" width="168" height="42" rx="8" fill="url(#chipBg)" stroke="#d97706" stroke-width="1" stroke-opacity="0.7" />
    <text x="84" y="18" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#fbbf24">FINOPS CAPITAL SAVINGS</text>
    <text x="84" y="32" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">30%+ Cloud Optimization</text>
  </g>

  <!-- Chip 5: High Availability SLA -->
  <g transform="translate(786, 288)">
    <rect x="0" y="0" width="172" height="42" rx="8" fill="url(#chipBg)" stroke="#dc2626" stroke-width="1" stroke-opacity="0.7" />
    <text x="86" y="18" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#f87171">99.995% SLA | RTO &lt; 15m</text>
    <text x="86" y="32" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Multi-AZ VMSS • ASR DR</text>
  </g>

</svg>
