<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="45%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="accentGlow" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#9333ea" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.8" />
    </linearGradient>

    <!-- Headline Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0f2fe" />
      <stop offset="65%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Chip Gradient -->
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.96); }
    }
    @keyframes blink {
      0%, 100% { fill-opacity: 1; }
      50% { fill-opacity: 0.3; }
    }
    .status-dot {
      animation: blink 2s infinite ease-in-out;
    }
    .glow-border {
      filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.35));
    }
    .title-font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
    }
    .sub-font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .mono-font {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
  </style>

  <!-- Base Card Background with Shadow -->
  <rect x="10" y="10" width="980" height="360" rx="20" fill="url(#bgGradient)" filter="url(#cardShadow)" />
  <rect x="10" y="10" width="980" height="360" rx="20" fill="url(#grid)" />
  <rect x="10" y="10" width="980" height="360" rx="20" fill="url(#cyanGlow)" />
  <rect x="10" y="10" width="980" height="360" rx="20" fill="url(#purpleGlow)" />
  <rect x="10" y="10" width="980" height="360" rx="20" fill="url(#accentGlow)" />

  <!-- Outer Neon Gradient Border -->
  <rect x="10" y="10" width="980" height="360" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Top Status Badge / Pill -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="460" height="30" rx="15" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <circle class="status-dot" cx="16" cy="15" r="4.5" fill="#10b981" />
    <circle cx="16" cy="15" r="7" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
    <text x="32" y="19" class="mono-font" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">
      SYSTEM STATUS: <tspan fill="#34d399">ONLINE</tspan> • 7+ YRS ENTERPRISE CLOUD & AI
    </text>
  </g>

  <!-- Top Right Executive Badge -->
  <g transform="translate(685, 42)">
    <rect x="0" y="0" width="275" height="30" rx="15" fill="#1e1b4b" fill-opacity="0.7" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5" />
    <text x="137" y="19" text-anchor="middle" class="mono-font" font-size="11" font-weight="600" fill="#a5b4fc" letter-spacing="1">
      ⚡ ARCHITECT / LEAD LEVEL
    </text>
  </g>

  <!-- Main Name Typography -->
  <text x="40" y="145" class="title-font" font-size="46" fill="url(#textGrad)" filter="url(#neonGlow)">
    PARSHURAM JAMDHADE
  </text>

  <!-- Primary Professional Role -->
  <text x="42" y="185" class="sub-font" font-size="18" fill="url(#subGrad)">
    LEAD DEVSECOPS ARCHITECT &amp; ENTERPRISE AI SYSTEMS ENGINEER
  </text>

  <!-- Executive Pitch Line -->
  <text x="42" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#cbd5e1" font-weight="400">
    Architecting zero-downtime <tspan fill="#38bdf8" font-weight="600">100+ Cloud Workload Migrations</tspan>, hardened <tspan fill="#38bdf8" font-weight="600">Zero-Trust DevSecOps</tspan>,
  </text>
  <text x="42" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#cbd5e1" font-weight="400">
    and autonomous <tspan fill="#c084fc" font-weight="600">GenAI / LLMOps Infrastructure</tspan> using Model Context Protocol (MCP) &amp; Agentic RAG.
  </text>

  <!-- Decorative Blueprint Horizontal Line -->
  <line x1="40" y1="270" x2="960" y2="270" stroke="#334155" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="4 4" />

  <!-- Core Competency Chips -->
  <!-- Chip 1: Enterprise Migration -->
  <g transform="translate(40, 290)">
    <rect x="0" y="0" width="168" height="42" rx="8" fill="url(#chipBg)" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6" />
    <text x="84" y="18" text-anchor="middle" class="mono-font" font-size="10.5" font-weight="700" fill="#38bdf8">100+ WORKLOADS</text>
    <text x="84" y="32" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Zero-Downtime Azure/AWS</text>
  </g>

  <!-- Chip 2: DevSecOps Zero-Trust -->
  <g transform="translate(224, 290)">
    <rect x="0" y="0" width="168" height="42" rx="8" fill="url(#chipBg)" stroke="#059669" stroke-width="1" stroke-opacity="0.6" />
    <text x="84" y="18" text-anchor="middle" class="mono-font" font-size="10.5" font-weight="700" fill="#34d399">ZERO-TRUST SHIFT-LEFT</text>
    <text x="84" y="32" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Checkov • Trivy • GitLeaks</text>
  </g>

  <!-- Chip 3: GenAI & MCP -->
  <g transform="translate(408, 290)">
    <rect x="0" y="0" width="176" height="42" rx="8" fill="url(#chipBg)" stroke="#9333ea" stroke-width="1" stroke-opacity="0.6" />
    <text x="88" y="18" text-anchor="middle" class="mono-font" font-size="10.5" font-weight="700" fill="#c084fc">MCP &amp; AUTONOMOUS AI</text>
    <text x="88" y="32" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">K8s Triage • Hybrid RAG</text>
  </g>

  <!-- Chip 4: FinOps Capital Stewardship -->
  <g transform="translate(600, 290)">
    <rect x="0" y="0" width="168" height="42" rx="8" fill="url(#chipBg)" stroke="#d97706" stroke-width="1" stroke-opacity="0.6" />
    <text x="84" y="18" text-anchor="middle" class="mono-font" font-size="10.5" font-weight="700" fill="#fbbf24">FINOPS CAPITAL SAVINGS</text>
    <text x="84" y="32" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">30%+ Cloud Optimization</text>
  </g>

  <!-- Chip 5: High Availability SLA -->
  <g transform="translate(784, 290)">
    <rect x="0" y="0" width="176" height="42" rx="8" fill="url(#chipBg)" stroke="#dc2626" stroke-width="1" stroke-opacity="0.6" />
    <text x="88" y="18" text-anchor="middle" class="mono-font" font-size="10.5" font-weight="700" fill="#f87171">99.995% SLA | RTO &lt; 15m</text>
    <text x="88" y="32" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Multi-AZ VMSS • ASR DR</text>
  </g>

</svg>
